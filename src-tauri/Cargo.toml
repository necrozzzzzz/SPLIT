[package]
name = "split"
version = "2.0.0-alpha.1"
description = "Lightweight Deadlock savestate utility"
authors = ["necrozzzzzz"]
edition = "2021"
rust-version = "1.95"

[lib]
name = "split_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39.6"
tauri = { version = "2.11.5", features = [] }
thiserror = "2"
